version: '3.9'

services:
  # ── PostgreSQL local ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taxamoto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxamoto
      POSTGRES_PASSWORD: taxamoto_dev
      POSTGRES_DB: taxamoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxamoto"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (sessions, rate limiting, cache) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: taxamoto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: taxamoto_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://taxamoto:taxamoto_dev@postgres:5432/taxamoto"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Admin Panel ────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.dev
    container_name: taxamoto_admin
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:3000"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/admin:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
